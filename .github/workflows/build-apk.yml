name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :composeApp:assembleDebug
      - run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk JReader.apk
      - uses: actions/upload-artifact@v4
        with: {name: JReader, path: JReader.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          prerelease: false
          files: JReader.apk
